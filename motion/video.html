<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Invisible — motion typographique</title>
<style>
@font-face{font-family:CG;src:url(fonts/CormorantGaramond.ttf);font-weight:300 700;font-style:normal}
@font-face{font-family:CG;src:url(fonts/CormorantGaramond-Italic.ttf);font-weight:300 700;font-style:italic}
@font-face{font-family:IN;src:url(fonts/Inter-Medium.otf);font-weight:500}
html,body{margin:0;padding:0;background:#EFE7D3;overflow:hidden}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#EFE7D3}
#stage *{box-sizing:border-box}
.abs{position:absolute}
.serif{font-family:CG,serif;font-weight:500;letter-spacing:-0.015em;font-kerning:normal}
.sans{font-family:IN,sans-serif;font-weight:500;letter-spacing:-0.008em;font-kerning:normal}
.line{white-space:nowrap}
.w{display:inline-block}
.rule{position:absolute;transform-origin:0 50%}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ============================================================
   VECTEUR D'EXCELLENCE — « Invisible. » — motion typographique
   Le temps est piloté par render(t) : aucune animation CSS.
   Format : ?f=v (9:16, 1080×1920)  |  ?f=h (16:9, 1920×1080)
   ============================================================ */
const Q = new URLSearchParams(location.search);
const F = Q.get('f') === 'h' ? 'h' : 'v';
const COL = {cream:'#EFE7D3', navy:'#1A0089', orange:'#D4633F', ink:'#1F1F1F'};

/* ---- Gabarits : marges gauche/droite IDENTIQUES sur les sept plans ---- */
const CFG = {
  v:{ W:1080, H:1920, M:96, ruleY:640, ruleH:3, dy:14,
      bigY:1000, headSize:128, headY:830,
      p2Top:950, p2Size:84, p2Gap:56, p2LH:1.14,
      topY:772, enumSize:76, enumGap:70, enumLH:1.2,
      s4Size:92, s4Gap:70, s4LH:1.12, s4Top:772,
      e5Size:62, e5Pitch:200, e5RuleW:150, e5RuleGap:34, e5Top:772,
      s6Size:112, s6Y:1000, s6LH:1.16,
      logoSize:112, logoY:520, contactSize:40, contactY:742 },
  h:{ W:1920, H:1080, M:160, ruleY:360, ruleH:3, dy:12,
      bigY:700, headSize:110, headY:500,
      p2Top:590, p2Size:76, p2Gap:36, p2LH:1.14,
      topY:480, enumSize:74, enumGap:46, enumLH:1.2,
      s4Size:92, s4Gap:54, s4LH:1.12, s4Top:480,
      e5Size:60, e5Pitch:148, e5RuleW:140, e5RuleGap:24, e5Top:430,
      s6Size:112, s6Y:640, s6LH:1.16,
      logoSize:120, logoY:236, contactSize:38, contactY:450 }
}[F];
const {W,H,M} = CFG;
const stage = document.getElementById('stage');
stage.style.width = W+'px'; stage.style.height = H+'px';

(async()=>{
await Promise.all(['500 100px CG','italic 500 100px CG','500 100px IN'].map(f=>document.fonts.load(f,'Invisible é')));
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const easeOut = x=>1-Math.pow(1-clamp(x),3);
const easeIO  = x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const r3 = x=>Math.round(x*1000)/1000;
function mk(tag, cls, parent=stage){ const e=document.createElement(tag); e.className=cls||''; parent.appendChild(e); return e; }

/* ============================================================
   MINUTAGE (secondes) — équivalent en dixièmes dans SCRIPT.md
   ============================================================ */
const T = {
  p1_in:0.6,                                      // PLAN 1  0:00 – 0:07  (muet)
  p2_move:7.0, p2_moveDur:1.4, p2_out:17.4,       // PLAN 2  0:07 – 0:18
  p2_A1:8.6, p2_A2:9.3, p2_B1:11.4, p2_B2:12.1,
  p3_1:18.6, p3_2:20.6, p3_3:22.8,                // PLAN 3  0:18 – 0:30 (coupe sèche à 30.0)
  p4_cut:30.0, p4_a1:30.8, p4_a2:31.5, p4_b1:34.2, p4_b2:34.9, p4_out:41.5,   // PLAN 4  0:30 – 0:42
  p5_1:42.6, p5_2:44.5, p5_3:46.4, p5_4:48.3, p5_out:54.4,                    // PLAN 5  0:42 – 0:55
  p6_bg:54.8, p6_bgDur:1.2, p6_in:56.2, p6_inDur:0.9, p6_out:62.8, ruleOut:63.0, // PLAN 6  0:55 – 1:04
  p7_logo:64.2, p7_rule:64.9, p7_contact:65.8     // PLAN 7  1:04 – 1:08
};
const T_END = 68.0;

/* ---- Fonds : crème (A) / marine (B) + règle à 1/3 de hauteur ---- */
const navy = mk('div','abs');
navy.style.cssText += `left:0;top:0;width:${W}px;height:${H}px;background:${COL.navy};opacity:0`;
const ruleO = mk('div','rule'), ruleC = mk('div','rule');
[[ruleO,COL.orange],[ruleC,COL.cream]].forEach(([r,c])=>{
  r.style.cssText += `left:${M}px;top:${CFG.ruleY-CFG.ruleH/2}px;width:${W-2*M}px;height:${CFG.ruleH}px;background:${c}`;
});

/* ---- Animation d'un mot / d'une ligne : fondu court + translation minimale ---- */
const ANIMS = [];
function reveal(t, tIn, dur, tOut, dOut){
  const p = easeOut((t-tIn)/dur), q = easeIO((t-tOut)/dOut);
  return {p, o:p*(1-q)};
}

/* lines : [{t:"texte", at:secondes, i:true?, color?, stagger?}] */
function textBlock({lines, cls, size, color, lh, gap=0, top, left=M, width=W-2*M, align='left', tOut=1e9, dOut=.5, dur=.5, centerY=null}){
  const box = mk('div','abs'); box.style.cssText += `left:${left}px;width:${width}px;text-align:${align};` + (top!=null?`top:${top}px;`:'');
  const words = [];
  lines.forEach((ln,i)=>{
    const d = mk('div','line '+cls, box);
    d.style.cssText += `font-size:${size}px;line-height:${lh};color:${ln.color||color};${ln.i?'font-style:italic;':''}${i>0?`margin-top:${ln.gap!=null?ln.gap:gap}px;`:''}`;
    const ws = ln.t.split(' ');
    ws.forEach((w,k)=>{
      const s = mk('span','w',d); s.textContent=w;
      if (k<ws.length-1) d.appendChild(document.createTextNode(' '));
      words.push({s, at: ln.at + k*(ln.stagger||0)});
    });
  });
  if (centerY!=null){ const h = box.getBoundingClientRect().height; box.style.top = (centerY-h/2)+'px'; }
  ANIMS.push({apply(t){
    let sig='';
    words.forEach(({s,at})=>{
      const {p,o} = reveal(t,at,dur,tOut,dOut);
      s.style.opacity = r3(o); s.style.transform = `translateY(${r3((1-p)*CFG.dy)}px)`;
      sig += r3(o)+','+r3((1-p)*CFG.dy)+';';
    });
    return sig;
  }});
  return box;
}

/* Règle orange qui se trace de gauche à droite */
function traceRule({x,y,w,color,tIn,dur=.5,tOut=1e9,dOut=.5}){
  const r = mk('div','rule'); r.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:${CFG.ruleH}px;background:${color}`;
  ANIMS.push({apply(t){
    const p = easeIO((t-tIn)/dur), o = 1-easeIO((t-tOut)/dOut);
    r.style.transform = `scaleX(${r3(p)})`; r.style.opacity = r3(o);
    return r3(p)+'|'+r3(o);
  }});
  return r;
}

const V = F==='v';
const lineSet = (a, b)=> V ? a : b;   // a = lignes 9:16 (retours manuels) ; b = lignes 16:9

/* ---------- PLAN 1 → 2 : le mot « Invisible. » ---------- */
const wordEl = mk('div','abs serif');
wordEl.textContent = 'Invisible.';
wordEl.style.cssText += `left:${M}px;line-height:1;white-space:nowrap;color:${COL.ink};transform-origin:0 50%;font-size:100px;letter-spacing:-0.02em`;
const w100 = wordEl.getBoundingClientRect().width;
const BIG = Math.floor((W-2*M)/w100*100*10)/10;      // largeur = zone utile exacte
wordEl.style.fontSize = BIG+'px';
wordEl.style.top = (CFG.bigY-BIG/2)+'px';
const HEAD_S = CFG.headSize/BIG, HEAD_DY = CFG.headY-CFG.bigY;
ANIMS.push({apply(t){
  const m = easeIO((t-T.p2_move)/T.p2_moveDur);
  const {p,o} = reveal(t, T.p1_in, .8, T.p2_out, .5);
  const sc = 1+(HEAD_S-1)*m, ty = HEAD_DY*m + (1-p)*CFG.dy*2;
  wordEl.style.opacity = r3(o);
  wordEl.style.transform = `translateY(${r3(ty)}px) scale(${r3(sc*1000)/1000})`;
  return r3(o)+','+r3(ty)+','+sc.toFixed(5);
}});

/* ---------- PLAN 2 : la phrase s'écrit sous le mot ---------- */
const P2 = {cls:'serif', size:CFG.p2Size, color:COL.ink, lh:CFG.p2LH, tOut:T.p2_out};
const st = .1;
const p2A = textBlock({...P2, top:CFG.p2Top, lines: lineSet(
  [{t:"Ce n’est pas votre travail", at:T.p2_A1, stagger:st},{t:"qui est en cause.", at:T.p2_A2, stagger:st}],
  [{t:"Ce n’est pas votre travail qui est en cause.", at:T.p2_A1, stagger:st}])});
const hA = p2A.getBoundingClientRect().height;
textBlock({...P2, top:CFG.p2Top+hA+CFG.p2Gap, lines: lineSet(
  [{t:"C’est ce qu’on trouve", at:T.p2_B1, stagger:st},{t:"de vous.", at:T.p2_B2, stagger:st}],
  [{t:"C’est ce qu’on trouve de vous.", at:T.p2_B1, stagger:st}])});

/* ---------- PLAN 3 : trois lignes, alignées à gauche, la 3e en orange ---------- */
const E3 = {cls:'sans', size:CFG.enumSize, color:COL.ink, lh:CFG.enumLH, dur:.55};
let y3 = CFG.topY;
[[[{t:"Une fiche vide.", at:T.p3_1}], null],
 [[{t:"Un site de 2017.", at:T.p3_2}], null],
 [lineSet([{t:"Un formulaire qui", at:T.p3_3},{t:"ne renvoie rien.", at:T.p3_3}],[{t:"Un formulaire qui ne renvoie rien.", at:T.p3_3}]), COL.orange]
].forEach(([lines,col])=>{
  const b = textBlock({...E3, top:y3, color:col||COL.ink, lines, tOut:T.p4_cut-0.001, dOut:0.001});
  y3 += b.getBoundingClientRect().height + CFG.enumGap;
});

/* ---------- PLAN 4 : inversion — fond marine, texte crème ---------- */
const P4 = {cls:'serif', size:CFG.s4Size, color:COL.cream, lh:CFG.s4LH, tOut:T.p4_out, dur:.6};
const s4a = textBlock({...P4, top:CFG.s4Top, lines: lineSet(
  [{t:"On ne vous compare pas", at:T.p4_a1, stagger:.1},{t:"à vos concurrents.", at:T.p4_a2, stagger:.1}],
  [{t:"On ne vous compare pas à vos concurrents.", at:T.p4_a1, stagger:.1}])});
textBlock({...P4, top:CFG.s4Top+s4a.getBoundingClientRect().height+CFG.s4Gap, lines: lineSet(
  [{t:"On vous compare à", at:T.p4_b1, stagger:.1},{t:"ce qu’on voit d’eux.", at:T.p4_b2, stagger:.1, i:true}],
  [{t:"On vous compare à ce qu’on voit d’eux.", at:T.p4_b1, stagger:.1}])});

/* ---------- PLAN 5 : quatre lignes, chacune précédée d'une règle orange ---------- */
[["Une page claire.",T.p5_1],["Une fiche complète.",T.p5_2],["Des photos justes.",T.p5_3],["Quelqu’un qui l’entretient.",T.p5_4]].forEach(([t,at],k)=>{
  const y = CFG.e5Top + k*CFG.e5Pitch;
  traceRule({x:M,y,w:CFG.e5RuleW,color:COL.orange,tIn:at,dur:.55,tOut:T.p5_out,dOut:.5});
  textBlock({cls:'sans', size:CFG.e5Size, color:COL.cream, lh:1.2, top:y+CFG.e5RuleGap, lines:[{t,at:at+.3}], tOut:T.p5_out, dur:.5});
});

/* ---------- PLAN 6 : une seule phrase, centrée, tenue longtemps ---------- */
textBlock({cls:'serif', size:CFG.s6Size, color:COL.ink, lh:CFG.s6LH, centerY:CFG.s6Y, align:'center',
  dur:T.p6_inDur, tOut:T.p6_out, dOut:.7, lines: lineSet(
  [{t:"Votre métier mérite",at:T.p6_in},{t:"mieux qu’un résultat",at:T.p6_in},{t:"de recherche.",at:T.p6_in}],
  [{t:"Votre métier mérite mieux",at:T.p6_in},{t:"qu’un résultat de recherche.",at:T.p6_in}])});

/* ---------- PLAN 7 : signature — logo, règle orange, ligne de contact ---------- */
const logo = textBlock({cls:'serif', size:CFG.logoSize, color:COL.navy, lh:1, align:'center', dur:.7,
  lines:[{t:"Vecteur d’excellence", at:T.p7_logo}]});
logo.style.top = (CFG.logoY-CFG.logoSize/2)+'px';
textBlock({cls:'sans', size:CFG.contactSize, color:COL.ink, lh:1, align:'center', dur:.6, top:CFG.contactY-CFG.contactSize/2,
  lines:[{t:"vecteur.excellence@gmail.com", at:T.p7_contact}]});
document.querySelectorAll('.sans').forEach(e=>{ if(e.textContent.includes('@')) e.style.letterSpacing='0.02em'; });

/* ============================================================
   render(t) : positionne tout, renvoie une signature d'état
   ============================================================ */
function render(t){
  // fond : coupe sèche à 30.0 (bascule), retour en fondu long sur le plan 6
  let n = 0;
  if (t >= T.p4_cut-1e-6) n = 1;
  if (t >= T.p6_bg) n = 1-easeIO((t-T.p6_bg)/T.p6_bgDur);
  navy.style.opacity = r3(n);
  // règle de fond (1/3 de hauteur) : orange sur crème, crème sur marine ; s'efface avant la signature
  const rv = 1-easeIO((t-T.ruleOut)/.6);
  const inSig = t >= T.p7_rule;
  const sx = inSig ? easeIO((t-T.p7_rule)/.8) : 1;
  const ro = inSig ? 1 : rv;
  ruleO.style.opacity = r3((1-n)*ro); ruleC.style.opacity = r3(n*ro);
  ruleO.style.transform = ruleC.style.transform = `scaleX(${r3(sx)})`;
  let sig = n+'|'+ro+'|'+sx+'#';
  ANIMS.forEach(a=>{ sig += a.apply(t)+'/'; });
  return sig;
}
window.render = render;
window.T_END = T_END;
window.overflowReport = ()=>{
  const bad=[]; document.querySelectorAll('.line').forEach(l=>{ if(l.scrollWidth>W-2*M+1) bad.push(l.textContent+' '+l.scrollWidth); });
  return {BIG, bad};
};

window.READY = true;
})();

</script>
</body>
</html>
